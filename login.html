<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La Tavola - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: #181818;
            padding: 35px;
            border-radius: 15px;
            border: 1px solid #292929;
        }

        h1 {
            color: #f5a623;
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;

            background: #111;
            color: white;

            border: 1px solid #333;
            border-radius: 8px;

            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;

            background: #f5a623;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #ffb638;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>La Tavola</h1>

        <p>Admin prijava</p>

        <form method="POST" action="/login">

            <input
                type="text"
                name="username"
                placeholder="Korisničko ime"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Lozinka"
                required
            >

            <button type="submit">
                Prijavi se
            </button>

        </form>

    </div>

</body>

</html>

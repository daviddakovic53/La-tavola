<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La Tavola - Admin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #f5a623;
        }

        .subtitle {
            color: #999;
            margin-top: 6px;
        }

        .card {
            background: #181818;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 25px;
            overflow-x: auto;
        }

        .card h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            color: #f5a623;
            padding: 15px;
            border-bottom: 1px solid #333;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #292929;
            color: #ddd;
        }

        tr:hover {
            background: #202020;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #888;
        }

        .back-button {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: #f5a623;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        .back-button:hover {
            background: #ffb638;
        }
       .delete-button {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    min-width: 90px;
}

.delete-button:hover {
    background: #c0392b;
}
.logout-button {
    background: #555;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
}
.logout-button:hover {
    background: #777;
}
.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.stat-card {
    background: #181818;
    border: 1px solid #292929;
    border-radius: 12px;
    padding: 25px;
    text-align: center;
}

.stat-card h3 {
    font-size: 32px;
    color: #f5a623;
    margin: 0 0 8px 0;
}

.stat-card p {
    color: #aaa;
    margin: 0;
}

        @media (max-width: 700px) {
            body {
                padding: 20px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .logo {
                font-size: 26px;
            }

            th,
            td {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">

            <div>
                <div class="logo">La Tavola</div>
                <div class="subtitle">Administracija rezervacija</div>
            </div>

            <a href="/" class="back-button">
                ← Natrag na stranicu
            </a>
            <form action="/logout" method="POST">
    <button type="submit" class="logout-button">Odjavi se</button>
</form>

        </div>

        <div class="card">

            <h2>📅 Rezervacije</h2>
            <div class="stats">

    <div class="stat-card">
        <h3 id="ukupnoRezervacija">0</h3>
        <p>Ukupno rezervacija</p>
    </div>

    <div class="stat-card">
        <h3 id="danasRezervacija">0</h3>
        <p>Rezervacija danas</p>
    </div>

    <div class="stat-card">
        <h3 id="ukupnoGostiju">0</h3>
        <p>Ukupno gostiju</p>
    </div>

</div>

            <table>

                <thead>
                    <tr>
                        <th>Ime i prezime</th>
                        <th>Datum</th>
                        <th>Vrijeme</th>
                        <th>Broj osoba</th>
                    </tr>
                </thead>

                <tbody id="reservationTable">
                </tbody>

            </table>

        </div>

    </div>

    <script>

       function ucitajRezervacije() {
    fetch("/rezervacije")
        .then(response => response.json())
        .then(rezervacije => {
            const ukupno = rezervacije.length;
            const danas = new Date().toISOString().split("T")[0];

            const rezervacijeDanas = rezervacije.filter(
                rezervacija => rezervacija.date === danas
            ).length;

            const ukupnoGostiju = rezervacije.reduce(
                (zbroj, rezervacija) => zbroj + Number(rezervacija.people),
                0
            );

            document.querySelector("#ukupnoRezervacija").textContent = ukupno;
            document.querySelector("#danasRezervacija").textContent = rezervacijeDanas;
            document.querySelector("#ukupnoGostiju").textContent = ukupnoGostiju;

            const table = document.querySelector("#reservationTable");
            table.innerHTML = "";

            if (rezervacije.length === 0) {
                table.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty">
                            Trenutno nema rezervacija.
                        </td>
                    </tr>
                `;
                return;
            }

            rezervacije.forEach((rezervacija, index) => {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${rezervacija.name}</td>
                    <td>${rezervacija.date}</td>
                    <td>${rezervacija.time}</td>
                    <td>${rezervacija.people}</td>
                    <td>
                        <button class="delete-button"
                            onclick="obrisiRezervaciju(${index})">
                            🗑️ Obriši
                        </button>
                    </td>
                `;

                table.appendChild(row);
            });
        });
}

ucitajRezervacije();
setInterval(ucitajRezervacije, 5000);
function obrisiRezervaciju(index) {
    const potvrda = confirm("Želiš li stvarno obrisati ovu rezervaciju?");

    if (!potvrda) {
        return;
    }

    fetch(`/rezervacija/${index}`, {
        method: "DELETE"
    })
    .then(response => response.json())
    .then(data => {
        alert(data.message);
        location.reload();
    });
}
    </script>

</body>

</html>
